name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  ci:
    runs-on: ubuntu-latest

    # Banco só do CI, para os testes que precisam de Postgres + pgvector de verdade.
    services:
      db:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_USER: atende
          POSTGRES_PASSWORD: senha-so-do-ci
          POSTGRES_DB: atende_teste
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U atende -d atende_teste"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    env:
      DATABASE_URL_TESTE: postgresql://atende:senha-so-do-ci@localhost:5432/atende_teste

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Instala o projeto
        run: pip install -e ".[dev]"

      - name: Lint
        run: ruff check .

      - name: Testes
        run: pytest

      # Reprova o PR se a busca piorar no acervo de exemplo (ver docs/adr/0008-avaliacao.md).
      - name: Avaliação da busca
        run: python ml/avaliacao/rodar.py
