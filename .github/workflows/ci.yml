name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Lint
        run: |
          pip install ruff
          ruff check .

      # Roda os testes só quando existirem.
      - name: Testes
        run: |
          if find . -name "test_*.py" -not -path "./.git/*" | grep -q .; then
            pip install pytest
            pytest
          else
            echo "Ainda não há testes."
          fi
